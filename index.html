<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Pokedex</title>
</head>
<body>
        
        <div class="poke-list">
            <template class="poke-template-item">
                <div class="poke-item">
                    
                    <div class="poke-item-id">
                        <h1 class="poke-id"></h1>
                    </div>

                    <div class="poke-item-text">
                        <h1 class="poke-name"></h1>
                    </div>
                            
                    <img class="poke-image" src="" alt="">
                </div>
            </template>
        
        </div>
    
        <div class="poke-container">

            <div class="poke-research">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="poke-search" type="text" placeholder="Enter a pokemon name">
            </div>

            <div class="poke-info">
                <h1 class="poke-id"></h1>
                <img class="poke-image" src="" alt="">
                <h1 class="poke-name"></h1>
                <p>type</p>
            </div>
            <template class="poke-template-types">
                <img class="poke-type" src="" alt="">  
            </template>

            <div class="poke-evolution-btn">
                <h1">Evolution</h1>
                <img class="poke-next-image" src="" alt="">
                <p class="poke-next-id"></p>
                <p class="poke-next-name"></p>
            </div>
    </div>
    
</body>
<script src="script.js"></script>
</html>
